<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Friv Offline Arcade</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#111;color:#fff}
button,input{font:inherit}.hidden{display:none!important}
#home{height:100%;display:flex;flex-direction:column;background:linear-gradient(145deg,#202020,#090909)}
header{height:54px;display:flex;align-items:center;gap:12px;padding:7px 12px;background:#0b0b0be8;border-bottom:1px solid #333;flex:none}
.logo{font-size:24px;font-weight:900;letter-spacing:-1px}.logo b:nth-child(1){color:#ffdf25}.logo b:nth-child(2){color:#ff5252}.logo b:nth-child(3){color:#48d7ff}.logo b:nth-child(4){color:#83ee62}
#search{margin-left:auto;width:min(280px,42vw);border:1px solid #444;border-radius:20px;background:#222;color:#fff;padding:8px 14px;outline:none}
.hbtn{border:0;border-radius:18px;background:#333;color:#fff;padding:8px 12px;cursor:pointer}
#grid{flex:1;overflow:auto;padding:9px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));grid-auto-rows:104px;gap:7px;align-content:start}
.card{position:relative;border:0;border-radius:7px;overflow:hidden;cursor:pointer;color:white;box-shadow:0 2px 5px #0008;transition:.12s transform;background:linear-gradient(135deg,hsl(var(--h) 80% 48%),hsl(calc(var(--h) + 55) 80% 34%))}
.card:hover{transform:scale(1.055);z-index:2}.card .ico{font-size:38px;display:block;line-height:64px;text-shadow:0 2px 3px #0006}.card .nm{position:absolute;bottom:0;left:0;right:0;padding:5px 3px;background:#000a;font-size:11px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .star{position:absolute;right:3px;top:2px;font-size:15px;opacity:.65}.card.fav .star{opacity:1;color:#ffe72e}
#player{position:fixed;inset:0;background:#090909;display:flex;flex-direction:column}
#bar{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:6px 10px;background:#181818;border-bottom:1px solid #333}
#back{font-size:22px;width:40px;height:36px}.barbtn{border:0;border-radius:6px;background:#303030;color:#fff;padding:7px 11px;cursor:pointer}
#title{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spacer{flex:1}
#stageWrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;background:radial-gradient(circle,#242424,#050505)}
canvas{background:#10131a;max-width:100%;max-height:100%;touch-action:none;box-shadow:0 0 25px #000}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.panel{pointer-events:auto;background:#111e;border:1px solid #555;border-radius:14px;padding:22px;text-align:center;max-width:390px;width:calc(100% - 30px);box-shadow:0 10px 40px #000}
.panel h2{margin:0 0 8px}.panel p{color:#bbb;font-size:14px}.primary{border:0;border-radius:8px;background:#68dc55;color:#071006;font-weight:bold;padding:11px 22px;cursor:pointer}
#touch{height:82px;flex:none;display:none;justify-content:space-between;align-items:center;padding:5px 12px;background:#111}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,34px);gap:3px}.pad button,.action{border:0;border-radius:8px;background:#333;color:white;font-weight:bold;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1}.pad .down{grid-column:2}.pad .right{grid-column:3}.action{width:74px;height:60px;background:#a52e2e}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#000d;padding:8px 14px;border-radius:20px;font-size:12px;pointer-events:none;opacity:0;transition:.2s;z-index:9}
@media(pointer:coarse),(max-width:700px){#touch{display:flex}#grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));grid-auto-rows:91px}.card .ico{line-height:55px;font-size:32px}header{height:50px}.logo{font-size:20px}.hbtn{padding:7px}}
</style>

<style>
#snesHost>div{max-width:100%!important;max-height:100%!important}
#snesHost canvas{max-width:100%!important;max-height:100%!important;image-rendering:auto}
#portableBuild:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:600px){
 #retroModal{padding:7px!important}
 #retroModal>div{padding:12px!important}
 #emuScreen>div:first-child{height:44px!important}
}
@media(orientation:landscape) and (pointer:coarse){
 #emuScreen>div:first-child{height:40px!important}
}
</style>

</head>
<body>
<div id="home">
<header><div class="logo"><b>F</b><b>R</b><b>I</b><b>V</b> <span style="font-size:11px;color:#999">OFFLINE</span></div><input id="search" placeholder="Find a game…"><button class="hbtn" id="favBtn">★ Favorites</button><button class="hbtn" id="retroBtn">🎮 ROMs</button></header>
<div id="grid"></div>
</div>
<div id="player" class="hidden">
<div id="bar"><button id="back" class="barbtn">←</button><span id="title"></span><span class="spacer"></span><span id="scoreText"></span><button id="restart" class="barbtn">↻</button><button id="full" class="barbtn">⛶</button></div>
<div id="stageWrap"><canvas id="c" width="800" height="520"></canvas><div id="overlay"></div></div>
<div id="touch"><div class="pad"><button class="up" data-k="ArrowUp">▲</button><button class="left" data-k="ArrowLeft">◀</button><button class="down" data-k="ArrowDown">▼</button><button class="right" data-k="ArrowRight">▶</button></div><button class="action" data-k="Space">ACTION</button></div>
</div>
<div id="toast"></div>
<div id="retroModal" class="hidden" style="position:fixed;inset:0;z-index:50;background:#000e;overflow:auto;padding:14px">
 <div style="max-width:820px;margin:auto;background:#181818;border:1px solid #444;border-radius:14px;padding:16px">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
   <h2 style="margin:0">Retro ROM Library</h2><span style="flex:1"></span><button class="barbtn" id="retroClose">✕</button>
  </div>
  <p style="color:#bbb;line-height:1.45;margin-bottom:10px">
   Import your own SNES <b>.smc/.sfc</b> backups (and NES .nes files for library storage).
   SNES games have a PLAY button. The emulator engine is cached locally after its first installation.
  </p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
   <input id="romInput" type="file" accept=".nes,.smc,.sfc" multiple style="display:none">
   <button class="primary" id="romPick">＋ Import ROM</button>
   <button class="barbtn" id="installSnes">Install / Repair SNES Engine</button>
   <button class="barbtn" id="portableBuild" disabled>Make Portable Offline HTML</button>
  </div>
  <div id="coreStatus" style="margin:10px 0;padding:9px;border-radius:8px;background:#222;color:#bbb;font-size:12px">Checking SNES engine…</div>
  <div id="romStatus" style="font-size:12px;color:#aaa;margin:5px 0 12px"></div>
  <div id="romList"></div>
 </div>
</div>

<div id="emuScreen" class="hidden" style="position:fixed;inset:0;z-index:80;background:#050505;display:flex;flex-direction:column">
 <div style="height:48px;display:flex;align-items:center;gap:8px;padding:6px 9px;background:#151515;border-bottom:1px solid #333;flex:none">
  <button class="barbtn" id="emuExit">← Arcade</button>
  <b id="emuTitle" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b>
  <span style="flex:1"></span>
  <button class="barbtn" id="emuFull">⛶</button>
 </div>
 <div id="emuMessage" style="display:none;padding:9px;background:#5d2b12;color:#fff;font-size:13px;text-align:center"></div>
 <div id="snesHost" style="flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000"></div>
</div>

<!-- The portable-export feature places a base64 emulator core here. -->
<script id="offlineSnesEngine" type="application/x-friv-snes-core"></script>

<script>
const GAMES=[{"name":"Neon Snake","type":"snake","desc":"Eat pixels, grow longer, don't crash.","icon":"🐍"},{"name":"Brick Blaster","type":"breakout","desc":"Clear every brick with your bouncing energy ball.","icon":"🧱"},{"name":"Star Defender","type":"shooter","desc":"Defend the sector from endless enemy waves.","icon":"🚀"},{"name":"Road Rush","type":"dodger","desc":"Change lanes and survive increasingly fast traffic.","icon":"🏎️"},{"name":"Sky Flap","type":"flap","desc":"Thread the flyer through an endless obstacle course.","icon":"🐦"},{"name":"Mine Sweeper","type":"mines","desc":"Clear the field without touching a mine.","icon":"💣"},{"name":"Memory Flip","type":"memory","desc":"Match every pair in as few moves as possible.","icon":"🧠"},{"name":"Merge 2048","type":"merge","desc":"Slide and merge numbers to reach 2048.","icon":"🔢"},{"name":"Paddle Duel","type":"pong","desc":"First to seven wins against the CPU.","icon":"🏓"},{"name":"Color Catch","type":"catch","desc":"Catch only the falling blocks that match your color.","icon":"🎨"},{"name":"Tower Stack","type":"stack","desc":"Drop moving blocks and build the tallest tower.","icon":"🏗️"},{"name":"Reaction Tap","type":"reaction","desc":"Wait for green, then react as quickly as possible.","icon":"⚡"},{"name":"Target Pop","type":"targets","desc":"Hit as many moving targets as you can in 45 seconds.","icon":"🎯"},{"name":"Gravity Hop","type":"jumper","desc":"Leap from platform to platform and climb forever.","icon":"🦘"},{"name":"Coin Collector","type":"collector","desc":"Collect coins while avoiding roaming enemies.","icon":"🪙"},{"name":"Simon Lights","type":"simon","desc":"Memorize and repeat an ever-growing light sequence.","icon":"💡"},{"name":"Tic Tac Toe","type":"ttt","desc":"Classic noughts and crosses against the computer.","icon":"❎"},{"name":"Connect Four","type":"connect","desc":"Drop four tokens in a row before the CPU.","icon":"🔴"},{"name":"Lights Out","type":"lights","desc":"Turn every tile dark using the fewest moves.","icon":"🟨"},{"name":"Quick Math","type":"math","desc":"Solve as many arithmetic challenges as possible.","icon":"➗"},{"name":"Word Scramble","type":"word","desc":"Unscramble the word before the timer expires.","icon":"🔤"},{"name":"Space Invaders","type":"invaders","desc":"Destroy formations before they reach your base.","icon":"👾"},{"name":"Falling Blocks","type":"tetris","desc":"Complete horizontal lines with falling tetrominoes.","icon":"🟦"},{"name":"Pac Grid","type":"pac","desc":"Collect every dot while avoiding hunters.","icon":"🟡"},{"name":"Helicopter Cave","type":"cave","desc":"Hold to rise, release to fall, survive the cave.","icon":"🚁"}];
const $=s=>document.querySelector(s), grid=$('#grid'), home=$('#home'), player=$('#player'), c=$('#c'),x=c.getContext('2d'), overlay=$('#overlay');
let active=null,raf=0,keys={},favOnly=false,state={},last=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=(a,b)=>a+Math.random()*(b-a), hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function favorites(){try{return JSON.parse(localStorage.blazeFrivFav||'[]')}catch(e){return[]}}
function render(){
 let q=$('#search').value.toLowerCase(), fs=favorites();grid.innerHTML='';
 GAMES.forEach((g,i)=>{if((favOnly&&!fs.includes(i))||(!g.name.toLowerCase().includes(q)))return;
 let b=document.createElement('button');b.className='card '+(fs.includes(i)?'fav':'');b.style.setProperty('--h',(i*47)%360);
 b.innerHTML=`<span class="star">★</span><span class="ico">${g.icon}</span><span class="nm">${g.name}</span>`;
 b.onclick=e=>{if(e.target.classList.contains('star')){toggleFav(i);return}openGame(i)};grid.appendChild(b);
 })}
function toggleFav(i){let a=favorites(),p=a.indexOf(i);p<0?a.push(i):a.splice(p,1);localStorage.blazeFrivFav=JSON.stringify(a);render()}
$('#search').oninput=render;$('#favBtn').onclick=()=>{favOnly=!favOnly;$('#favBtn').textContent=favOnly?'★ All Games':'★ Favorites';render()};
function toast(s){let t=$('#toast');t.textContent=s;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1200)}
function bestKey(){return 'blazeBest_'+active.type} function setScore(v){state.score=v|0;$('#scoreText').textContent='Score '+(v|0)+'  Best '+Math.max(v|0,+(localStorage[bestKey()]||0))}
function saveBest(){if(state.score>+(localStorage[bestKey()]||0))localStorage[bestKey()]=state.score}
function menuOverlay(title,desc,button='PLAY'){overlay.innerHTML=`<div class="panel"><h2>${title}</h2><p>${desc}</p><button class="primary">${button}</button></div>`;overlay.querySelector('button').onclick=()=>{overlay.innerHTML='';initGame()}}
function openGame(i){active=GAMES[i];home.classList.add('hidden');player.classList.remove('hidden');$('#title').textContent=active.icon+' '+active.name;cancelAnimationFrame(raf);state={score:0};setScore(0);menuOverlay(active.name,active.desc+'<br><br>Keyboard: arrows/WASD + Space. Touch controls are available on mobile.')}
function closeGame(){cancelAnimationFrame(raf);saveBest();active=null;player.classList.add('hidden');home.classList.remove('hidden');overlay.innerHTML=''}
$('#back').onclick=closeGame;$('#restart').onclick=()=>{cancelAnimationFrame(raf);overlay.innerHTML='';initGame()};$('#full').onclick=()=>player.requestFullscreen?.();
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{keys[k]=true;e.preventDefault()};b.onpointerup=b.onpointercancel=e=>keys[k]=false});
c.onpointerdown=e=>{keys.Space=true;state.pointer={x:e.offsetX*c.width/c.clientWidth,y:e.offsetY*c.height/c.clientHeight};setTimeout(()=>keys.Space=false,100)};
function bg(){x.fillStyle='#10131a';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#ffffff0b';for(let i=0;i<c.width;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height);x.stroke()}for(let i=0;i<c.height;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(c.width,i);x.stroke()}}
function text(s,px,py,size=24,align='center'){x.fillStyle='#fff';x.font=`bold ${size}px Arial`;x.textAlign=align;x.fillText(s,px,py)}
function end(msg='GAME OVER'){saveBest();cancelAnimationFrame(raf);menuOverlay(msg,'Score: '+(state.score|0)+' · Best: '+Math.max(state.score|0,+(localStorage[bestKey()]||0)),'PLAY AGAIN')}
function loop(fn){last=performance.now();function f(t){let dt=Math.min(.033,(t-last)/1000);last=t;fn(dt);if(active&&overlay.innerHTML==='')raf=requestAnimationFrame(f)}raf=requestAnimationFrame(f)}
function initGame(){keys={};state={score:0};setScore(0);let f=ENG[active.type]||ENG.targets;f()}
const ENG={};
ENG.snake=()=>{let s=[{x:10,y:10}],d={x:1,y:0},nd=d,food={x:16,y:10},acc=0;loop(dt=>{acc+=dt;if(keys.ArrowUp||keys.KeyW)nd={x:0,y:-1};if(keys.ArrowDown||keys.KeyS)nd={x:0,y:1};if(keys.ArrowLeft||keys.KeyA)nd={x:-1,y:0};if(keys.ArrowRight||keys.KeyD)nd={x:1,y:0};if(acc>.11){acc=0;if(nd.x!=-d.x||nd.y!=-d.y)d=nd;let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.x>=25||h.y<0||h.y>=16||s.some(p=>p.x==h.x&&p.y==h.y))return end();s.unshift(h);if(h.x==food.x&&h.y==food.y){setScore(state.score+10);food={x:Math.floor(rnd(0,25)),y:Math.floor(rnd(0,16))}}else s.pop()}bg();x.fillStyle='#ff5252';x.fillRect(food.x*32+3,food.y*32+3,26,26);x.fillStyle='#69e75b';s.forEach(p=>x.fillRect(p.x*32+2,p.y*32+2,28,28))})};
ENG.breakout=()=>{let p={x:330,y:485,w:140,h:14},b={x:400,y:430,vx:210,vy:-230,r:9},br=[];for(let r=0;r<6;r++)for(let q=0;q<10;q++)br.push({x:43+q*72,y:45+r*30,w:65,h:22});loop(dt=>{p.x+=((keys.ArrowRight||keys.KeyD)?360:0-(keys.ArrowLeft||keys.KeyA?360:0))*dt;p.x=clamp(p.x,0,660);b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<10||b.x>790)b.vx*=-1;if(b.y<10)b.vy=Math.abs(b.vy);if(b.y>540)return end();if(b.y+b.r>p.y&&b.x>p.x&&b.x<p.x+p.w&&b.vy>0){b.vy=-Math.abs(b.vy);b.vx+=(b.x-(p.x+p.w/2))*2}for(let i=br.length-1;i>=0;i--){let z=br[i];if(b.x>z.x&&b.x<z.x+z.w&&b.y+b.r>z.y&&b.y-b.r<z.y+z.h){br.splice(i,1);b.vy*=-1;setScore(state.score+10);break}}if(!br.length)return end('YOU CLEARED IT!');bg();x.fillStyle='#5ed9ff';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#fff';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();br.forEach((z,i)=>{x.fillStyle=`hsl(${i*9+10} 80% 55%)`;x.fillRect(z.x,z.y,z.w,z.h)})})};
function shooter(inv=false){let p={x:380,y:470,w:38,h:24},bul=[],en=[],spawn=0,shot=0;loop(dt=>{let dir=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);p.x=clamp(p.x+dir*330*dt,0,762);shot-=dt;if(keys.Space&&shot<=0){bul.push({x:p.x+18,y:p.y,vy:-520});shot=.18}spawn-=dt;if(spawn<=0){spawn=inv?.45:Math.max(.22,1-state.score/2500);en.push({x:rnd(20,750),y:20,w:30,h:24,vy:rnd(45,100)+state.score/30})}bul.forEach(a=>a.y+=a.vy*dt);en.forEach(a=>a.y+=a.vy*dt);for(let i=en.length-1;i>=0;i--){if(en[i].y>500)return end();for(let j=bul.length-1;j>=0;j--)if(hit({x:bul[j].x,y:bul[j].y,w:4,h:12},en[i])){en.splice(i,1);bul.splice(j,1);setScore(state.score+10);break}}bg();x.fillStyle='#58e5ff';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#ffe15b';bul.forEach(a=>x.fillRect(a.x,a.y,4,12));x.fillStyle='#f05';en.forEach(a=>{x.fillRect(a.x,a.y,a.w,a.h);x.fillStyle='#fff';x.fillRect(a.x+6,a.y+7,5,5);x.fillRect(a.x+19,a.y+7,5,5);x.fillStyle='#f05'})})}
ENG.shooter=()=>shooter(false);ENG.invaders=()=>shooter(true);
function laneDodge(free=false){let p={x:385,y:430,w:30,h:45},obs=[],sp=0,t=0;loop(dt=>{t+=dt;let dx=((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0),dy=((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0);p.x=clamp(p.x+dx*280*dt,20,750);if(free)p.y=clamp(p.y+dy*280*dt,40,460);sp-=dt;if(sp<=0){sp=Math.max(.18,.7-t/100);obs.push({x:rnd(20,750),y:-50,w:rnd(22,48),h:rnd(25,55),v:rnd(150,260)+t*3})}obs.forEach(o=>o.y+=o.v*dt);for(let o of obs)if(hit(p,o))return end();obs=obs.filter(o=>o.y<550);setScore(Math.floor(t*10));bg();x.fillStyle='#53e3ff';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#ff704f';obs.forEach(o=>x.fillRect(o.x,o.y,o.w,o.h))})}
ENG.dodger=()=>laneDodge(false);ENG.dodger2=()=>laneDodge(true);ENG.asteroid=()=>laneDodge(true);
ENG.flap=()=>{let p={x:180,y:250,vy:0},pipes=[],sp=0,t=0,was=false;loop(dt=>{t+=dt;let press=keys.Space||keys.ArrowUp;if(press&&!was)p.vy=-300;was=press;p.vy+=780*dt;p.y+=p.vy*dt;sp-=dt;if(sp<=0){sp=1.55;let gap=rnd(120,350);pipes.push({x:820,g:gap,w:65,passed:false})}pipes.forEach(o=>o.x-=190*dt);for(let o of pipes){if(!o.passed&&o.x<180){o.passed=true;setScore(state.score+1)}if(180+18>o.x&&180-18<o.x+o.w&&(p.y-15<o.g-70||p.y+15>o.g+70))return end()}if(p.y<0||p.y>520)return end();bg();x.fillStyle='#ffe23e';x.beginPath();x.arc(180,p.y,16,0,7);x.fill();x.fillStyle='#64db70';pipes.forEach(o=>{x.fillRect(o.x,0,o.w,o.g-70);x.fillRect(o.x,o.g+70,o.w,520-o.g-70)})})};
ENG.targets=()=>{let ts=[],time=45,sp=0;c.onpointerdown=e=>{let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*800/r.width,py=(e.clientY-r.top)*520/r.height;for(let i=ts.length-1;i>=0;i--){let a=ts[i];if(Math.hypot(px-a.x,py-a.y)<a.r){ts.splice(i,1);setScore(state.score+10);break}}};loop(dt=>{time-=dt;if(time<=0)return end("TIME!");sp-=dt;if(sp<=0){sp=.45;ts.push({x:rnd(50,750),y:rnd(60,470),r:rnd(18,34),life:1.4})}ts.forEach(a=>a.life-=dt);ts=ts.filter(a=>a.life>0);bg();ts.forEach(a=>{x.fillStyle='#ff4d62';x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke()});text(Math.ceil(time)+'s',400,35,20)})};

async function embeddedCore(){

 var b64=el && el.textContent ? el.textContent.trim() : "";

function setCoreStatus(msg,ok){

 e.textContent=msg;
 e.style.background=ok?"#17351d":"#3c2719";
 e.style.color=ok?"#a8f3b6":"#ffd1a5";

async function refreshCoreStatus(){
 if(typeof window.embedSuperNintendo==="function"){setCoreStatus("✓ SNES engine loaded. Offline play is ready.",true);return true}
 var embedded=await embeddedCore();
 if(embedded){try{evalSnesCore(embedded);setCoreStatus("✓ Embedded SNES engine loaded. This HTML is fully portable/offline.",true);return true}catch(e){}}
 var cached=await coreRead();
 if(cached){try{evalSnesCore(cached);setCoreStatus("✓ SNES engine found in local cache. Offline play is ready on this device.",true);return true}catch(e){}}

async function fetchTextWithTimeout(url,ms){
 var ctl=typeof AbortController!=="undefined"?new AbortController():null;
 var tm=ctl?setTimeout(function(){ctl.abort()},ms):0;
 try{
  var r=await fetch(url,{cache:"no-store",mode:"cors",signal:ctl?ctl.signal:undefined});
  if(!r.ok)throw new Error("HTTP "+r.status);
  var txt=await r.text();
  if(txt.length<300000)throw new Error("Downloaded core was unexpectedly small");
  return txt
 }finally{if(tm)clearTimeout(tm)}
}
async function installSnesCore(){

 setCoreStatus("Downloading SNES engine… keep this page open.",false);
 var urls=[
  "https://raw.githubusercontent.com/lrusso/SuperNintendo/main/SuperNintendo.min.js",
  "https://lrusso.github.io/SuperNintendo/SuperNintendo.min.js"
 ];
 var lastErr=null;
 for(var i=0;i<urls.length;i++){
  try{
   var code=await fetchTextWithTimeout(urls[i],25000);
   code=patchCore(code);
   evalSnesCore(code);
   await coreWrite(code);
   setCoreStatus("✓ SNES engine installed and cached. You can now play .smc/.sfc offline on this device.",true);
   btn.disabled=false;return true
  }catch(e){lastErr=e}
 }
 btn.disabled=false;
 setCoreStatus("Could not install the SNES engine. Check internet access and try again. "+(lastErr?lastErr.message:""),false);
 return false
}
async function ensureSnesCore(){

}

}
async function playROM(id){
 var r=await romGet(id);
 if(!r)return;
 if(!/\.(smc|sfc)$/i.test(r.name)){
  document.getElementById("romStatus").textContent="NES playback is not enabled in this release; SNES .smc/.sfc playback is enabled.";
  return
 }
 document.getElementById("retroModal").classList.add("hidden");
 var screen=document.getElementById("emuScreen"), host=document.getElementById("snesHost"), msg=document.getElementById("emuMessage");

 try{
  if(!await ensureSnesCore())throw new Error("SNES engine is unavailable.");
  msg.textContent="Loading "+r.name+"…";
  var ab=await blobToArrayBuffer(r.data);
  var coarse=false;
  try{coarse=matchMedia("(pointer:coarse)").matches||innerWidth<800}catch(e){coarse=innerWidth<800}
  emuRunning=true;
  var fn=window.embedSuperNintendo || embedSuperNintendo;
  fn({
   container:"snesHost",
   name:r.name.replace(/\.(smc|sfc)$/i,""),
   rom:ab,
   soundEnabled:true,
   showMobileControls:coarse,
   backText:"BACK",
   soundText:"SOUND",
   loadText:"LOAD",
   saveText:"SAVE",
   player1:{
    up:"ArrowUp",down:"ArrowDown",left:"ArrowLeft",right:"ArrowRight",
    a:"KeyW",b:"KeyQ",x:"KeyS",y:"KeyA",l:"KeyZ",r:"KeyX",start:"Enter",select:"ShiftRight"
   },
   player2:{
    up:"KeyI",down:"KeyK",left:"KeyJ",right:"KeyL",
    a:"KeyU",b:"KeyH",x:"KeyO",y:"KeyN",l:"KeyP",r:"KeyM",start:"KeyB",select:"KeyV"
   },
   cbStarted:function(){msg.style.display="none"}
  });
  setTimeout(function(){if(emuRunning)msg.style.display="none"},3500)
 }catch(e){
  emuRunning=false;msg.style.display="block";msg.textContent="SNES start failed: "+(e&&e.message?e.message:e)

}
async function renderROMs(){

  var d=document.createElement("div");
  d.style.cssText="display:flex;gap:7px;align-items:center;padding:10px 0;border-top:1px solid #333;flex-wrap:wrap";
  var isSNES=/\.(smc|sfc)$/i.test(r.name),sys=isSNES?"SNES":"NES";
  var title=document.createElement("b");title.style.cssText="flex:1;min-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";title.innerHTML=safeName(r.name);
  var badge=document.createElement("small");badge.textContent=sys;badge.style.cssText="padding:4px 7px;border-radius:10px;background:#292929;color:#bbb";
  d.append(title,badge);
  if(isSNES){
   var play=document.createElement("button");play.className="primary";play.textContent="▶ PLAY";play.onclick=function(){playROM(r.id)};d.appendChild(play)
  }
  var ex=document.createElement("button");ex.className="barbtn";ex.textContent="Export";ex.onclick=function(){dlBlob(r.data,r.name)};
  var de=document.createElement("button");de.className="barbtn";de.textContent="Delete";de.onclick=function(){romDel(r.id)};
  d.append(ex,de);box.appendChild(d)

}
async function makePortableOffline(){
 var code=loadedCoreCode || await coreRead() || await embeddedCore();

 var clone=document.documentElement.cloneNode(true);
 var node=clone.querySelector("#offlineSnesEngine");

 node.textContent=utf8ToB64(patchCore(code));

 document.getElementById("romStatus").textContent="Portable offline HTML created. It includes the cached SNES emulator engine."
}
